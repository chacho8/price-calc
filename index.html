<!doctype html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cHacHo8 Nail 恰初八美甲 報價機</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: "Noto Sans TC", sans-serif; background: linear-gradient(135deg, #fff8f0 0%, #fef5ec 50%, #fff0e6 100%); color: #3b3b3b; margin: 0; padding-bottom: 140px; }
        /* 固定在右上角的按鈕設定 */
        .lang-toggle { 
            position: fixed; 
            right: 15px; 
            top: 15px; 
            background: #1a3a52; 
            color: white; 
            padding: 8px 15px; 
            border-radius: 50px; 
            font-size: 0.75rem; 
            font-weight: bold; 
            cursor: pointer; 
            z-index: 9999; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            border: 2px solid white;
        }
        .navbar { display: flex; justify-content: center; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); padding: 12px; gap: 8px; position: sticky; top: 0; box-shadow: 0 2px 12px rgba(0,0,0,0.08); z-index: 100; flex-wrap: wrap; }
        .navbar button { background: #f5f5f5; border: none; padding: 10px 14px; border-radius: 20px; cursor: pointer; color: #666; font-size: 0.85rem; display: flex; flex-direction: column; align-items: center; }
        .navbar button.active { background: linear-gradient(135deg, #1a3a52 0%, #0f2437 100%); color: white; font-weight: 600; }
        .card { background: white; border-radius: 24px; padding: 24px; margin: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1px solid rgba(26,58,82,0.08); }
        .card h2 { font-size: 1.1rem; color: #1a3a52; border-left: 5px solid #1a3a52; padding-left: 12px; margin-bottom: 20px; font-weight: 700; }
        .calc-item { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px dashed #e5e5e5; }
        .original-price { font-size: 0.75rem; color: #aaa; text-decoration: line-through; }
        .current-price { color: #e67e22; font-weight: 600; font-size: 0.85rem; }
        .total-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #1a3a52; color: white; text-align: center; padding: 20px; z-index: 200; display: flex; justify-content: center; align-items: center; gap: 12px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .num-input { width: 65px; border: 1px solid #d1d5db; border-radius: 10px; padding: 6px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

    <div class="lang-toggle" onclick="toggleLang()" id="langBtn">EN / 繁中</div>

    <div class="text-center p-10">
        <div class="flex flex-col justify-center items-center gap-4 mb-3">
            <img src="logo.png" alt="Logo" onerror="this.src='https://via.placeholder.com/100'" class="w-24 h-24 object-cover rounded-full border-4 border-white shadow-lg">
            <h1 class="text-3xl font-extrabold text-[#1a3a52] tracking-tight">cHacHo8 Nail</h1>
        </div>
        <p class="text-sm tracking-[0.1em] text-[#1a3a52] font-medium opacity-80" id="slogan">竹北美甲｜盲盒＆手繪造型</p>
    </div>

    <div class="navbar">
        <button class="tab-btn active" onclick="showTab('price')">💰 <span data-zh="價格計算" data-en="Price">價格計算</span></button>
        <button class="tab-btn" onclick="showTab('booking')">📋 <span data-zh="預約須知" data-en="Booking">預約須知</span></button>
        <button class="tab-btn" onclick="showTab('faq')">❓ <span data-zh="常見問題" data-en="FAQ">常見問題</span></button>
        <button class="tab-btn" onclick="showTab('care')">✨ <span data-zh="美甲照顧" data-en="Care">美甲照顧</span></button>
    </div>

    <div id="price" class="tab-content active">
        <div class="card">
            <h2 data-zh="🖐️ 手部項目" data-en="🖐️ Hand Services">🖐️ 手部項目</h2>
            <div class="calc-item">
                <div><span data-zh="單色凝膠" data-en="Solid Color">單色凝膠</span><br><span class="original-price">$900</span> <span class="current-price">$300</span></div>
                <input type="checkbox" class="price-item w-7 h-7" data-price="300">
            </div>
            <div class="calc-item">
                <div data-zh="延甲服務" data-en="Extension">延甲服務</div>
                <div class="flex items-center gap-2"><input type="number" id="ext-fingers" class="num-input" min="0" max="10" value="0"></div>
            </div>
        </div>
        </div>

    <div class="total-bar">
        <span id="totalLabel">預估金額 Estimated</span>: 
        <span id="total-amount" class="text-2xl font-bold text-[#d89ba8]">NT$0</span>
    </div>

    <script>
        let currentLang = 'zh';
        const langData = {
            zh: { slogan: "竹北美甲｜盲盒＆手繪造型", total: "預估金額" },
            en: { slogan: "Zhubei Nails | Blind Box & Hand-painted", total: "Total Amount" }
        };

        function toggleLang() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            document.querySelectorAll('[data-zh]').forEach(el => {
                el.innerText = el.getAttribute(`data-${currentLang}`);
            });
            document.getElementById('slogan').innerText = langData[currentLang].slogan;
            calculate();
        }

        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function calculate() {
            let total = 0;
            document.querySelectorAll('.price-item:checked').forEach(cb => { total += parseInt(cb.dataset.price); });
            const f = parseInt(document.getElementById('ext-fingers').value) || 0;
            total += (f >= 9) ? 900 : (f * 100);
            document.getElementById('total-amount').innerText = `NT$${total.toLocaleString()}`;
        }

        document.querySelectorAll('.price-item').forEach(cb => cb.addEventListener('change', calculate));
        document.getElementById('ext-fingers').addEventListener('input', calculate);
    </script>
</body>
</html>

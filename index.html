<!doctype html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cHacHo8 Nail 恰初八美甲 報價機</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: "Noto Sans TC", sans-serif; background: linear-gradient(135deg, #fff8f0 0%, #fef5ec 50%, #fff0e6 100%); color: #3b3b3b; margin: 0; padding-bottom: 140px; }
        .lang-toggle { position: fixed; right: 15px; top: 15px; background: #1a3a52; color: white; padding: 8px 15px; border-radius: 50px; font-size: 0.75rem; font-weight: bold; cursor: pointer; z-index: 999; box-shadow: 0 4px 10px rgba(0,0,0,0.2); border: 2px solid white; }
        .navbar { display: flex; justify-content: center; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); padding: 12px; gap: 8px; position: sticky; top: 0; box-shadow: 0 2px 12px rgba(0,0,0,0.08); z-index: 100; flex-wrap: wrap; }
        .navbar button { background: #f5f5f5; border: none; padding: 10px 14px; border-radius: 20px; cursor: pointer; color: #666; font-size: 0.85rem; display: flex; flex-direction: column; align-items: center; }
        .navbar button.active { background: linear-gradient(135deg, #1a3a52 0%, #0f2437 100%); color: white; font-weight: 600; }
        .nav-icon { width: 20px; height: 20px; object-fit: contain; margin-bottom: 2px; }
        .card { background: white; border-radius: 24px; padding: 24px; margin: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1px solid rgba(26,58,82,0.08); }
        .card h2 { font-size: 1.1rem; color: #1a3a52; border-left: 5px solid #1a3a52; padding-left: 12px; margin-bottom: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .calc-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px dashed #e5e5e5; }
        .calc-item:last-child { border-bottom: none; }
        .original-price { font-size: 0.75rem; color: #aaa; text-decoration: line-through; margin-right: 4px; }
        .current-price { color: #e67e22; font-weight: 600; font-size: 0.85rem; }
        .promo-tag { font-size: 0.82rem; color: #d89ba8; font-weight: 600; }
        .total-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: linear-gradient(135deg, #1a3a52 0%, #0f2437 100%); color: white; text-align: center; padding: 20px; z-index: 200; display: flex; justify-content: center; align-items: center; gap: 12px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.4s ease; }
        .num-input { width: 65px; border: 1px solid #d1d5db; border-radius: 10px; padding: 6px; text-align: center; font-weight: bold; color: #1a3a52; }
        .section-title { color: #1a3a52; font-weight: bold; margin-top: 18px; margin-bottom: 8px; display: block; }
        .reset-btn { width: 100%; padding: 14px; margin-top: 10px; background: #f0f0f0; border: none; border-radius: 12px; color: #666; cursor: pointer; }
    </style>
</head>
<body>

    <div class="lang-toggle" onclick="toggleLang()" id="langBtn">EN / 繁中</div>

    <div class="text-center p-10">
        <div class="flex flex-col justify-center items-center gap-4 mb-3">
            <img src="logo.png" alt="Logo" onerror="this.src='https://via.placeholder.com/100?text=cHacHo8'" class="w-24 h-24 object-cover rounded-full border-4 border-white shadow-lg">
            <h1 class="text-3xl font-extrabold text-[#1a3a52] tracking-tight">cHacHo8 Nail 恰初八美甲</h1>
        </div>
        <p class="text-sm tracking-[0.1em] text-[#1a3a52] font-medium opacity-80" id="slogan">竹北美甲｜盲盒＆手繪造型</p>
    </div>

    <div class="navbar">
        <button class="tab-btn active" id="btn-price" onclick="showTab('price')">
            <img src="price.png" class="nav-icon" onerror="this.src='💰'">
            <span data-zh="價格計算" data-en="Prices">價格計算</span>
        </button>
        <button class="tab-btn" id="btn-booking" onclick="showTab('booking')">
            <span>📋</span>
            <span data-zh="預約須知" data-en="Booking">預約須知</span>
        </button>
        <button class="tab-btn" id="btn-faq" onclick="showTab('faq')">
            <span>❓</span>
            <span data-zh="常見問題" data-en="FAQ">常見問題</span>
        </button>
        <button class="tab-btn" id="btn-care" onclick="showTab('care')">
            <img src="flower.png" class="nav-icon" onerror="this.src='✨'">
            <span data-zh="美甲照顧" data-en="Aftercare">美甲照顧</span>
        </button>
    </div>

    <div id="price" class="tab-content active">
        <div class="card border-2 border-[#1a3a52] bg-[#f0f5f9]">
            <h2><img src="promo.png" class="w-6 h-6" onerror="this.style.display='none'"> <span data-zh="🔥 本月限定特惠" data-en="🔥 Monthly Special">🔥 本月限定特惠</span></h2>
            <div class="calc-item">
                <div><span data-zh="指定造型 (手模特惠價)" data-en="Design (Model Price)">指定造型 (手模特惠價)</span><br><span class="promo-tag">NT$699</span></div>
                <input type="checkbox" class="price-item w-7 h-7 accent-[#1a3a52]" data-price="699">
            </div>
        </div>

        <div class="card">
            <h2 data-zh="🖐️ 手部項目" data-en="🖐️ Hand Services">🖐️ 手部項目</h2>
            <div class="calc-item">
                <div><span data-zh="單色凝膠 (含前置)" data-en="Solid Color">單色凝膠 (含前置)</span><br><span class="original-price" data-zh="原價 $900" data-en="Reg. $900">原價 $900</span><span class="current-price" data-zh="手模價 $300" data-en="Special $300">手模價 $300</span></div>
                <input type="checkbox" class="price-item w-7 h-7 accent-[#1a3a52]" data-price="300">
            </div>
            <div class="calc-item">
                <div><span data-zh="造型設計 (跳色/法式/貓眼/漸層)" data-en="Design (Art)">造型設計 (跳色/法式/貓眼/漸層)</span><br><span class="original-price" data-zh="原價 $1000" data-en="Reg. $1000">原價 $1000</span><span class="current-price" data-zh="手模價 $400" data-en="Special $400">手模價 $400</span></div>
                <input type="checkbox" class="price-item w-7 h-7 accent-[#1a3a52]" data-price="400">
            </div>
            <div class="calc-item">
                <div data-zh="延甲服務 ($100/指 | 10指$900)" data-en="Extension ($100/pc | $900/10)">延甲服務 ($100/指 | 10指$900)</div>
                <div class="flex items-center gap-2"><input type="number" id="ext-fingers" class="num-input" min="0" max="10" value="0"><span data-zh="指" data-en="pcs">指</span></div>
            </div>
        </div>

        <div class="card">
            <h2 data-zh="🦶 足部項目" data-en="🦶 Foot Services">🦶 足部項目</h2>
            <div class="calc-item">
                <div><span data-zh="單色凝膠 (含前置)" data-en="Solid Color (Foot)">單色凝膠 (含前置)</span><br><span class="original-price" data-zh="原價 $1000" data-en="Reg. $1000">原價 $1000</span><span class="current-price" data-zh="特價 $500" data-en="Special $500">特價 $500</span></div>
                <input type="checkbox" class="price-item w-7 h-7 accent-[#1a3a52]" data-price="500">
            </div>
            <div class="calc-item">
                <div><span data-zh="造型設計 (跳色/法式/貓眼/漸層)" data-en="Design (Foot)">造型設計 (跳色/法式/貓眼/漸層)</span><br><span class="original-price" data-zh="原價 $1100" data-en="Reg. $1100">原價 $1100</span><span class="current-price" data-zh="特價 $600" data-en="Special $600">特價 $600</span></div>
                <input type="checkbox" class="price-item w-7 h-7 accent-[#1a3a52]" data-price="600">
            </div>
        </div>

        <div class="px-4 mb-6"><button class="reset-btn" onclick="resetAll()" data-zh="🔄 清除所有選擇" data-en="🔄 Reset All">🔄 清除所有選擇</button></div>
    </div>

    <div id="booking" class="tab-content">
        <div class="card">
            <h2 data-zh="📋 預約須知" data-en="📋 Booking Policy">📋 預約須知</h2>
            <div id="bookingContent" class="text-sm leading-7 text-gray-600"></div>
        </div>
    </div>

    <div id="faq" class="tab-content">
        <div class="card">
            <h2 data-zh="❓ 常見問題" data-en="❓ FAQ">❓ 常見問題</h2>
            <div id="faqContent" class="space-y-6 text-sm"></div>
        </div>
    </div>

    <div id="care" class="tab-content">
        <div class="card">
            <h2 data-zh="✨ 美甲照顧" data-en="✨ Aftercare">✨ 美甲照顧</h2>
            <div id="careContent" class="space-y-6 text-sm"></div>
        </div>
    </div>

    <div class="total-bar">
        <div class="flex flex-col items-start">
            <span class="text-[10px] opacity-70 uppercase" id="totalLabel">Estimated Total</span>
            <span id="total-amount" class="text-2xl font-bold text-[#d89ba8]">NT$0</span>
        </div>
        <div class="h-8 w-[1px] bg-white/20 mx-2"></div>
        <span id="item-count" class="bg-white/10 px-4 py-1 rounded-full text-xs">Selected 0</span>
    </div>

    <script>
        let currentLang = 'zh';
        const translations = {
            zh: {
                slogan: "竹北美甲｜盲盒＆手繪造型",
                totalLabel: "預估總金額",
                selected: "已選項目",
                booking: `
                    <strong class="section-title">📍 營業資訊</strong>
                    營業時間：週一~週五 9:30-17:00<br>
                    可約時段：9:30 或 13:30 兩場（也可微調）<br>
                    公休日：國定假日及週末
                    <strong class="section-title">📝 預約方式</strong>
                    LINE 或夯客預約：<a href="https://go.hotcake.app/g/1M5CLX" class="text-blue-500">go.hotcake.app/g/1M5CLX</a><br>
                    預約告知：姓名、聯絡電話、是否卸甲、想做的款式<br>
                    <div class="p-3 bg-red-50 text-red-600 rounded-xl mt-3">⚠️ 重要：取消或更改請於 24 小時前通知。</div>
                    <strong class="section-title">💳 付款方式</strong>
                    現金 / LINE Pay / 銀行轉帳
                    <strong class="section-title">🎁 手模招募</strong>
                    目前開放手模招募中，享有超優惠價格，歡迎私訊了解～
                `,
                faq: `
                    <div><p class="font-bold text-[#1a3a52]">Q1. 美甲可以維持多久？</p><p class="text-gray-500">一般凝膠可維持 3-4 週，視個人生長與習慣而定。</p></div>
                    <div><p class="font-bold text-[#1a3a52]">Q2. 第一次做美甲要準備什麼？</p><p class="text-gray-500">不需要！建議來之前不要塗指甲油，並保持乾淨。歡迎帶圖討論～</p></div>
                    <div><p class="font-bold text-[#1a3a52]">Q3. 孕婦可以做美甲嗎？</p><p class="text-gray-500">建議中後期施作，請先諮詢醫生意見並告知美甲師。</p></div>
                    <div><p class="font-bold text-[#1a3a52]">Q4. 美甲會傷害指甲嗎？</p><p class="text-gray-500">正確操作與卸甲不會傷甲。請務必避免自行摳除凝膠。</p></div>
                    <div><p class="font-bold text-[#1a3a52]">Q5. 可以自己選擇款式嗎？</p><p class="text-gray-500">當然可以！歡迎帶圖討論，我們也會提供建議～</p></div>
                    <div><p class="font-bold text-[#1a3a52]">Q6. 什麼是手模價？</p><p class="text-gray-500">願意配合拍照分享作品的優惠價格，不會露出個人資訊。</p></div>
                `,
                care: `
                    <strong class="section-title">🏠 居家急救</strong>
                    <p class="text-gray-600">小裂縫或輕微翹起：避免碰水，儘快預約回補。可用小剪刀剪掉翹起處，銼刀(180)修短。<br><span class="text-red-500 font-bold">千萬不要自己撕或摳！</span><br>💡 提醒：每天使用指緣油 2-3 次可增加持久度。</p>
                    <strong class="section-title">⚠️ 注意事項</strong>
                    <p class="text-gray-600">切勿當工具摳東西 (美甲不是金剛甲)。避免接觸強酸鹼清潔劑。發現翹起請儘快回店。</p>
                    <strong class="section-title">✨ 日常保養</strong>
                    <p class="text-gray-600">每天使用指緣油。洗手後擦乾。做家事建議戴手套。定期修剪指甲。</p>
                    <strong class="section-title">🔄 建議回補時間</strong>
                    <p class="text-gray-600">一般款式：3-4 週 / 延甲款式：2-3 週</p>
                `
            },
            en: {
                slogan: "Zhubei Nails | Blind Box & Design",
                totalLabel: "Estimated Total",
                selected: "Selected Items",
                booking: `
                    <strong class="section-title">📍 Business Hours</strong>
                    Mon-Fri 9:30-17:00<br>Slots: 9:30 or 13:30 (Slightly adjustable)<br>Closed on holidays & weekends.
                    <strong class="section-title">📝 Booking</strong>
                    LINE/App: <a href="https://go.hotcake.app/g/1M5CLX">go.hotcake.app/g/1M5CLX</a><br>Please provide: Name, Phone, Style, and if Removal is needed.<br>
                    <div class="p-3 bg-red-50 text-red-600 rounded-xl mt-3">⚠️ Cancellation: 24 hours in advance.</div>
                    <strong class="section-title">💳 Payment</strong>
                    Cash / LINE Pay / Bank Transfer
                `,
                faq: `
                    <div><p class="font-bold">Q1. How long does it last?</p><p class="text-gray-500">Usually 3-4 weeks.</p></div>
                    <div><p class="font-bold">Q4. Does it damage nails?</p><p class="text-gray-500">No damage with professional removal. Do not peel!</p></div>
                `,
                care: `
                    <strong class="section-title">🏠 Home SOS</strong>
                    <p class="text-gray-600">Do NOT peel or pick! Trim with scissors if lifting. Use cuticle oil 2-3 times daily.</p>
                `
            }
        };

        function toggleLang() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            document.querySelectorAll('[data-zh]').forEach(el => {
                el.innerText = el.getAttribute(`data-${currentLang}`);
            });
            document.getElementById('slogan').innerText = translations[currentLang].slogan;
            document.getElementById('bookingContent').innerHTML = translations[currentLang].booking;
            document.getElementById('faqContent').innerHTML = translations[currentLang].faq;
            document.getElementById('careContent').innerHTML = translations[currentLang].care;
            document.getElementById('totalLabel').innerText = translations[currentLang].totalLabel;
            calculate();
        }

        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            document.getElementById('btn-' + tabId).classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function calculate() {
            let total = 0; let count = 0;
            document.querySelectorAll('.price-item:checked').forEach(cb => { total += parseInt(cb.dataset.price); count++; });
            const f = parseInt(document.getElementById('ext-fingers').value) || 0;
            if (f > 0) { total += (f >= 9) ? 900 : (f * 100); count++; }
            document.getElementById('total-amount').innerText = `NT$${total.toLocaleString()}`;
            document.getElementById('item-count').innerText = `${translations[currentLang].selected} ${count}`;
        }

        function resetAll() {
            document.querySelectorAll('.price-item').forEach(cb => cb.checked = false);
            document.getElementById('ext-fingers').value = 0;
            calculate();
        }

        document.querySelectorAll('.price-item').forEach(cb => cb.addEventListener('change', calculate));
        document.getElementById('ext-fingers').addEventListener('input', calculate);
        
        // Initialize
        toggleLang(); toggleLang(); 
    </script>
</body>
</html>
